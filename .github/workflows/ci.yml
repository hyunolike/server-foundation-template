name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 소스와 테스트 이름에 한글을 쓴다. sun.jnu.encoding 은 로케일로만 바뀐다.
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # 린트 · 계약 테스트 · 봉투 테스트 · OpenAPI 스냅샷 검증이 모두 여기서 돈다.
      - name: check
        run: ./gradlew check

      # 호환성이 깨지는 스펙 변경은 PR 에서만 검사한다 — 기준 브랜치가 있어야 비교가 된다.
      - name: openapi 호환성 검사
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p build
          if git show "origin/${{ github.base_ref }}:docs/openapi/openapi.json" > build/base-openapi.json 2>/dev/null; then
            ./gradlew :foundation-docs:diffOpenApi -PbaseSpec=build/base-openapi.json
          else
            echo "기준 브랜치에 openapi.json 이 없습니다. 첫 도입이므로 비교를 건너뜁니다."
          fi

      - name: 테스트 리포트 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
